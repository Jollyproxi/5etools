name: 5e2024

services:
  5etools:
    container_name: 5e2024
    image: 5e2024
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8224:80" # where 8224 is the port on the machine and 80 is the internal port of the container. 